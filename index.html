<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bubble Blitz</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <style>
    :root {
      --neon-cyan:   #00f5ff;
      --neon-pink:   #ff2d78;
      --neon-yellow: #ffe600;
      --neon-green:  #39ff14;
      --neon-violet: #bf5fff;
      --bg-deep:     #05060f;
      --bg-card:     #0d0f1e;
      --bg-panel:    #080a17;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Rajdhani', sans-serif;
      background: var(--bg-deep);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      user-select: none;
    }

    /* ── STARFIELD ── */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .star {
      position: absolute;
      border-radius: 50%;
      background: #fff;
      animation: twinkle var(--d, 3s) var(--delay, 0s) infinite alternate;
      opacity: 0.4;
    }
    @keyframes twinkle {
      from { opacity: 0.15; transform: scale(1); }
      to   { opacity: 0.9;  transform: scale(1.4); }
    }

    /* ── SCANLINE OVERLAY ── */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.08) 2px,
        rgba(0,0,0,0.08) 4px
      );
      pointer-events: none;
      z-index: 100;
    }

    /* ── CARD ── */
    #gameCard {
      position: relative;
      z-index: 10;
      width: min(560px, 98vw);
      background: var(--bg-card);
      border-radius: 24px;
      border: 1.5px solid rgba(0,245,255,0.18);
      box-shadow:
        0 0 60px rgba(0,245,255,0.08),
        0 0 0 1px rgba(255,255,255,0.04),
        inset 0 1px 0 rgba(255,255,255,0.06);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── TOP BAR ── */
    #topBar {
      display: flex;
      justify-content: space-around;
      padding: 16px 20px 14px;
      background: rgba(0,0,0,0.35);
      border-bottom: 1px solid rgba(0,245,255,0.1);
      gap: 8px;
    }
    .stat-box {
      text-align: center;
      flex: 1;
      padding: 6px 10px;
      border-radius: 12px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
    }
    .stat-label {
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      font-weight: 600;
      margin-bottom: 2px;
    }
    .stat-value {
      font-family: 'Orbitron', monospace;
      font-size: clamp(20px, 5vw, 28px);
      font-weight: 700;
      line-height: 1;
    }
    #hitVal   { color: var(--neon-pink);   text-shadow: 0 0 16px var(--neon-pink); }
    #timerVal { color: var(--neon-cyan);   text-shadow: 0 0 16px var(--neon-cyan); }
    #scoreVal { color: var(--neon-green);  text-shadow: 0 0 16px var(--neon-green); }

    /* Timer urgency */
    #timerVal.urgent {
      color: var(--neon-pink) !important;
      text-shadow: 0 0 20px var(--neon-pink) !important;
      animation: urgentPulse 0.5s ease-in-out infinite alternate;
    }
    @keyframes urgentPulse {
      from { opacity: 1; }
      to   { opacity: 0.5; }
    }

    /* ── TARGET STRIP ── */
    #targetStrip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 10px 20px;
      background: rgba(0,0,0,0.25);
      border-bottom: 1px solid rgba(0,245,255,0.08);
    }
    #targetStrip .label {
      font-size: 11px;
      letter-spacing: 0.18em;
      color: rgba(255,255,255,0.35);
      text-transform: uppercase;
      font-weight: 600;
    }
    #targetBadge {
      font-family: 'Orbitron', monospace;
      font-size: clamp(22px, 6vw, 34px);
      font-weight: 900;
      color: var(--neon-yellow);
      text-shadow: 0 0 24px var(--neon-yellow), 0 0 48px rgba(255,230,0,0.3);
      min-width: 52px;
      text-align: center;
      transition: transform 0.15s, color 0.15s;
    }
    #targetBadge.pop {
      animation: badgePop 0.3s ease;
    }
    @keyframes badgePop {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.4) rotate(-5deg); }
      100% { transform: scale(1); }
    }

    /* ── PANEL ── */
    #panel {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
      gap: 10px;
      padding: 14px;
      background: var(--bg-panel);
      min-height: 340px;
      align-content: start;
    }

    /* ── BUBBLE ── */
    .bubble {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Orbitron', monospace;
      font-weight: 700;
      font-size: clamp(14px, 3.5vw, 20px);
      cursor: pointer;
      position: relative;
      transition: transform 0.12s, box-shadow 0.12s;
      animation: bubbleIn 0.35s cubic-bezier(0.34,1.56,0.64,1) backwards;
      border: 2px solid rgba(255,255,255,0.12);
      overflow: hidden;
    }
    .bubble::before {
      content: '';
      position: absolute;
      top: 12%;
      left: 20%;
      width: 30%;
      height: 18%;
      border-radius: 50%;
      background: rgba(255,255,255,0.35);
      filter: blur(2px);
      pointer-events: none;
    }
    .bubble:hover {
      transform: scale(1.12);
      z-index: 5;
    }
    .bubble:active { transform: scale(0.92); }

    @keyframes bubbleIn {
      from { transform: scale(0) rotate(-15deg); opacity: 0; }
      to   { transform: scale(1) rotate(0deg);   opacity: 1; }
    }

    .bubble.pop-anim {
      animation: bubblePop 0.35s forwards;
    }
    @keyframes bubblePop {
      0%   { transform: scale(1); opacity: 1; }
      40%  { transform: scale(1.5); opacity: 0.8; }
      100% { transform: scale(0); opacity: 0; }
    }

    /* Bubble color themes */
    .b-pink   { background: radial-gradient(circle at 35% 35%, #ff6eb4, #d6006e); box-shadow: 0 4px 20px rgba(255,45,120,0.45); }
    .b-cyan   { background: radial-gradient(circle at 35% 35%, #00f5ff, #007cff); box-shadow: 0 4px 20px rgba(0,150,255,0.45); }
    .b-green  { background: radial-gradient(circle at 35% 35%, #39ff14, #00b800); box-shadow: 0 4px 20px rgba(57,255,20,0.4); }
    .b-violet { background: radial-gradient(circle at 35% 35%, #bf5fff, #7700cc); box-shadow: 0 4px 20px rgba(135,50,255,0.45); }
    .b-amber  { background: radial-gradient(circle at 35% 35%, #ffe600, #ff8c00); box-shadow: 0 4px 20px rgba(255,180,0,0.45); }
    .b-rose   { background: radial-gradient(circle at 35% 35%, #ff9a9e, #ff3860); box-shadow: 0 4px 20px rgba(255,56,96,0.4); }

    /* ── OVERLAY ── */
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(5,6,15,0.92);
      backdrop-filter: blur(8px);
      z-index: 50;
      padding: 24px;
      text-align: center;
    }
    #overlay.hidden { display: none; }

    .overlay-title {
      font-family: 'Orbitron', monospace;
      font-size: clamp(24px, 6vw, 38px);
      font-weight: 900;
      letter-spacing: 0.05em;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }
    .overlay-sub {
      font-size: 13px;
      color: rgba(255,255,255,0.4);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 28px;
    }
    .btn-primary {
      font-family: 'Orbitron', monospace;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.1em;
      padding: 14px 36px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, var(--neon-cyan), #0088ff);
      color: #000;
      box-shadow: 0 0 30px rgba(0,245,255,0.5), 0 4px 20px rgba(0,0,0,0.4);
      transition: transform 0.15s, box-shadow 0.15s;
      text-transform: uppercase;
    }
    .btn-primary:hover {
      transform: translateY(-3px) scale(1.04);
      box-shadow: 0 0 50px rgba(0,245,255,0.7), 0 8px 30px rgba(0,0,0,0.4);
    }
    .btn-replay {
      background: linear-gradient(135deg, var(--neon-pink), #cc0055);
      box-shadow: 0 0 30px rgba(255,45,120,0.5), 0 4px 20px rgba(0,0,0,0.4);
    }
    .btn-replay:hover {
      box-shadow: 0 0 50px rgba(255,45,120,0.7), 0 8px 30px rgba(0,0,0,0.4);
    }

    .score-display {
      font-family: 'Orbitron', monospace;
      font-size: clamp(42px, 10vw, 64px);
      font-weight: 900;
      color: var(--neon-green);
      text-shadow: 0 0 30px var(--neon-green), 0 0 60px rgba(57,255,20,0.3);
      line-height: 1;
      margin-bottom: 8px;
    }
    .score-label {
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      margin-bottom: 28px;
    }

    /* ── FLASH EFFECT ── */
    #flash {
      position: fixed;
      inset: 0;
      background: rgba(0,245,255,0.12);
      pointer-events: none;
      opacity: 0;
      z-index: 200;
      transition: opacity 0.08s;
    }
    #flash.active { opacity: 1; }

    /* ── PARTICLES ── */
    .particle {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 150;
      animation: particleFly var(--dur, 0.6s) ease-out forwards;
    }
    @keyframes particleFly {
      0%   { transform: translate(0,0) scale(1); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
    }

    /* ── COMBO BADGE ── */
    #comboBadge {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      font-size: 28px;
      color: var(--neon-yellow);
      text-shadow: 0 0 20px var(--neon-yellow);
      pointer-events: none;
      z-index: 300;
      opacity: 0;
    }
    #comboBadge.show {
      animation: comboAnim 0.8s ease-out forwards;
    }
    @keyframes comboAnim {
      0%   { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
      40%  { opacity: 1; transform: translate(-50%, -60%) scale(1.3); }
      100% { opacity: 0; transform: translate(-50%, -80%) scale(1); }
    }

    /* ── BOTTOM BAR ── */
    #bottomBar {
      padding: 10px 16px;
      background: rgba(0,0,0,0.25);
      border-top: 1px solid rgba(0,245,255,0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .progress-track {
      flex: 1;
      height: 4px;
      background: rgba(255,255,255,0.06);
      border-radius: 2px;
      overflow: hidden;
    }
    #progressBar {
      height: 100%;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
      border-radius: 2px;
      transition: width 1s linear;
      box-shadow: 0 0 8px var(--neon-cyan);
    }
    #streakText {
      font-family: 'Orbitron', monospace;
      font-size: 11px;
      color: var(--neon-yellow);
      text-shadow: 0 0 8px var(--neon-yellow);
      margin-left: 14px;
      min-width: 60px;
      text-align: right;
      letter-spacing: 0.05em;
    }

    /* Floating decorative orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
      animation: drift var(--d, 12s) ease-in-out infinite alternate;
    }
    @keyframes drift {
      from { transform: translate(0, 0); }
      to   { transform: translate(var(--tx, 40px), var(--ty, 30px)); }
    }
  </style>
</head>

<body>
  <!-- Ambient orbs -->
  <div class="orb" style="width:300px;height:300px;background:rgba(0,245,255,0.07);top:-80px;left:-80px;--d:14s;--tx:60px;--ty:40px;"></div>
  <div class="orb" style="width:250px;height:250px;background:rgba(255,45,120,0.07);bottom:-60px;right:-60px;--d:11s;--tx:-50px;--ty:-30px;"></div>

  <!-- Starfield -->
  <div class="stars" id="stars"></div>

  <!-- Flash overlay -->
  <div id="flash"></div>

  <!-- Combo badge -->
  <div id="comboBadge"></div>

  <!-- GAME CARD -->
  <div id="gameCard">

    <!-- TOP BAR -->
    <div id="topBar">
      <div class="stat-box">
        <div class="stat-label">Hit</div>
        <div class="stat-value" id="hitVal">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Time</div>
        <div class="stat-value" id="timerVal">60</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Score</div>
        <div class="stat-value" id="scoreVal">0</div>
      </div>
    </div>

    <!-- TARGET STRIP -->
    <div id="targetStrip">
      <span class="label">Find</span>
      <div id="targetBadge">–</div>
      <span class="label">and pop it</span>
    </div>

    <!-- BUBBLE PANEL -->
    <div id="panel"></div>

    <!-- BOTTOM BAR -->
    <div id="bottomBar">
      <div class="progress-track">
        <div id="progressBar" style="width:100%"></div>
      </div>
      <div id="streakText"></div>
    </div>

    <!-- OVERLAY -->
    <div id="overlay">
      <div class="overlay-title">BUBBLE BLITZ</div>
      <div class="overlay-sub">Pop the right bubbles · Beat the clock</div>
      <button class="btn-primary" id="startBtn">START GAME</button>
    </div>

  </div>

  <script>
    // ── STARFIELD INIT ──
    const starsEl = document.getElementById('stars');
    for (let i = 0; i < 80; i++) {
      const s = document.createElement('div');
      const size = Math.random() * 2 + 0.5;
      s.className = 'star';
      s.style.cssText = `
        width:${size}px; height:${size}px;
        top:${Math.random()*100}%; left:${Math.random()*100}%;
        --d:${2+Math.random()*4}s; --delay:${Math.random()*4}s;
      `;
      starsEl.appendChild(s);
    }

    // ── ELEMENTS ──
    const panel       = document.getElementById('panel');
    const hitVal      = document.getElementById('hitVal');
    const scoreVal    = document.getElementById('scoreVal');
    const timerVal    = document.getElementById('timerVal');
    const overlay     = document.getElementById('overlay');
    const startBtn    = document.getElementById('startBtn');
    const targetBadge = document.getElementById('targetBadge');
    const progressBar = document.getElementById('progressBar');
    const streakText  = document.getElementById('streakText');
    const flash       = document.getElementById('flash');
    const comboBadge  = document.getElementById('comboBadge');

    // ── STATE ──
    let timer       = null;
    let timeLeft    = 60;
    let score       = 0;
    let hitNumber   = 0;
    let gameRunning = false;
    let streak      = 0;
    let bestStreak  = 0;

    // ── BUBBLE THEMES ──
    const bubbleClasses = ['b-pink','b-cyan','b-green','b-violet','b-amber','b-rose'];

    // ── MAKE BUBBLES ──
    function makeBubbles() {
      const cols   = Math.floor((panel.offsetWidth - 28) / 74);
      const count  = cols * 6;
      panel.innerHTML = '';

      for (let i = 0; i < count; i++) {
        const num   = Math.floor(Math.random() * 10);
        const cls   = bubbleClasses[Math.floor(Math.random() * bubbleClasses.length)];
        const delay = (i * 12) + 'ms';
        const div   = document.createElement('div');
        div.className = `bubble ${cls}`;
        div.textContent = num;
        div.style.animationDelay = delay;
        panel.appendChild(div);
      }
    }

    // ── GET NEW TARGET ──
    function getNewHit() {
      hitNumber = Math.floor(Math.random() * 10);
      hitVal.textContent   = hitNumber;
      targetBadge.textContent = hitNumber;
      targetBadge.classList.remove('pop');
      void targetBadge.offsetWidth;
      targetBadge.classList.add('pop');
    }

    // ── TIMER ──
    function startTimer() {
      clearInterval(timer);
      timer = setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
          timerVal.textContent = timeLeft;
          progressBar.style.width = (timeLeft / 60 * 100) + '%';
          timerVal.classList.toggle('urgent', timeLeft <= 10);
        } else {
          clearInterval(timer);
          endGame();
        }
      }, 1000);
    }

    // ── FLASH ──
    function triggerFlash() {
      flash.classList.add('active');
      setTimeout(() => flash.classList.remove('active'), 120);
    }

    // ── PARTICLES ──
    function spawnParticles(x, y, color) {
      const colors = ['#00f5ff','#ff2d78','#ffe600','#39ff14','#bf5fff'];
      for (let i = 0; i < 12; i++) {
        const p   = document.createElement('div');
        const sz  = 4 + Math.random() * 6;
        const ang = Math.random() * 360;
        const rad = 60 + Math.random() * 80;
        const dx  = Math.cos(ang * Math.PI / 180) * rad;
        const dy  = Math.sin(ang * Math.PI / 180) * rad;
        const c   = colors[Math.floor(Math.random() * colors.length)];
        p.className = 'particle';
        p.style.cssText = `
          width:${sz}px; height:${sz}px;
          background:${c}; box-shadow:0 0 6px ${c};
          left:${x}px; top:${y}px;
          --dx:${dx}px; --dy:${dy}px;
          --dur:${0.4 + Math.random() * 0.4}s;
        `;
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 800);
      }
    }

    // ── COMBO ──
    function showCombo(n) {
      if (n < 3) return;
      comboBadge.textContent = n + '× COMBO!';
      comboBadge.classList.remove('show');
      void comboBadge.offsetWidth;
      comboBadge.classList.add('show');
    }

    // ── WRONG SHAKE ──
    function shakeCard() {
      const card = document.getElementById('gameCard');
      card.style.animation = 'none';
      card.style.transform = 'translateX(-8px)';
      setTimeout(() => card.style.transform = 'translateX(8px)', 60);
      setTimeout(() => card.style.transform = 'translateX(-5px)', 120);
      setTimeout(() => card.style.transform = 'translateX(5px)', 180);
      setTimeout(() => card.style.transform = '', 240);
    }

    // ── BUBBLE CLICK ──
    panel.addEventListener('click', e => {
      if (!gameRunning) return;
      const bubble = e.target.closest('.bubble');
      if (!bubble) return;

      const clicked = Number(bubble.textContent);

      if (clicked === hitNumber) {
        // Correct!
        const rect = bubble.getBoundingClientRect();
        const cx   = rect.left + rect.width  / 2;
        const cy   = rect.top  + rect.height / 2;

        bubble.classList.add('pop-anim');
        setTimeout(() => bubble.remove(), 350);

        score  += 10;
        streak += 1;
        if (streak > bestStreak) bestStreak = streak;

        scoreVal.textContent = score;
        streakText.textContent = streak >= 2 ? `🔥 ×${streak}` : '';

        spawnParticles(cx, cy);
        triggerFlash();
        showCombo(streak);

        setTimeout(() => {
          makeBubbles();
          getNewHit();
        }, 120);

      } else {
        // Wrong!
        streak = 0;
        streakText.textContent = '';
        shakeCard();
        bubble.style.transition = 'background 0.2s';
        bubble.style.background = 'rgba(255,0,0,0.4)';
        setTimeout(() => bubble.style.background = '', 300);
      }
    });

    // ── END GAME ──
    function endGame() {
      gameRunning = false;
      clearInterval(timer);

      overlay.classList.remove('hidden');
      overlay.innerHTML = `
        <div class="overlay-title" style="font-size:clamp(18px,4vw,26px);margin-bottom:4px;">GAME OVER</div>
        <div class="score-label">FINAL SCORE</div>
        <div class="score-display">${score}</div>
        <div class="score-label" style="margin-bottom:10px;">Best streak: ${bestStreak}×</div>
        <button class="btn-primary btn-replay" id="restartBtn">PLAY AGAIN</button>
      `;
      document.getElementById('restartBtn').addEventListener('click', () => {
        overlay.classList.add('hidden');
        resetGame();
        startGame();
      });
    }

    // ── RESET ──
    function resetGame() {
      clearInterval(timer);
      timeLeft = 60;
      score    = 0;
      streak   = 0;
      bestStreak = 0;
      scoreVal.textContent  = '0';
      timerVal.textContent  = '60';
      hitVal.textContent    = '–';
      targetBadge.textContent = '–';
      progressBar.style.width = '100%';
      streakText.textContent  = '';
      timerVal.classList.remove('urgent');
      panel.innerHTML = '';
    }

    // ── START GAME ──
    function startGame() {
      if (gameRunning) return;
      gameRunning = true;
      overlay.classList.add('hidden');
      resetGame();
      makeBubbles();
      getNewHit();
      startTimer();
    }

    startBtn.addEventListener('click', startGame);

    // ── PAUSE/RESUME ──
    window.addEventListener('blur',  () => { if (gameRunning) clearInterval(timer); });
    window.addEventListener('focus', () => { if (gameRunning) startTimer(); });

    // ── RESIZE ──
    let resizeDebounce;
    window.addEventListener('resize', () => {
      clearTimeout(resizeDebounce);
      resizeDebounce = setTimeout(() => { if (gameRunning) makeBubbles(); }, 200);
    });
  </script>
</body>
</html>
